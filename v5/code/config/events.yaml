# METIS v4 — Macro/Crypto Event Calendar
# Manually updated weekly (R3 합의). Stale > 7d → conservative block.
#
# Schema:
#   event_id        — 고유 ID
#   type            — FOMC | CPI | PCE | NFP | FED_SPEECH | SOL_UNLOCK | ETH_UPGRADE | EXCHANGE_INCIDENT | OTHER
#   impact          — high | medium | low
#   start_utc       — ISO-8601 UTC timestamp
#   block_before_min — 이벤트 전 N분부터 block
#   block_after_min  — 이벤트 후 N분까지 block
#   size_multiplier  — block_after_min 이후 잔존 size 감산 (0.0-1.0). 1.0 = no reduction
#   source          — 출처 (검증용)
#   notes           — 사람 메모

